# EaglerXHorizon reverse proxy: TLS termination + WebSocket upgrade.
# Install as /etc/nginx/sites-available/eaglerxhorizon and symlink into sites-enabled.
# Certificates come from certbot, which rewrites the ssl_certificate lines for you.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream eaglerxhorizon_proxy {
    server 127.0.0.1:8081;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name proxy.example.com;

    # Let certbot answer the ACME challenge over plain HTTP.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name proxy.example.com;

    ssl_certificate     /etc/letsencrypt/live/proxy.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/proxy.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;

    # Client bodies are tiny binary frames; the default 1 MB is generous.
    client_max_body_size 2m;

    # ---- dashboard: static files, long cache for hashed assets -----------------
    location / {
        root /srv/eaglerxhorizon/web;
        index index.html;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache" always;
    }

    location /pkg/ {
        root /srv/eaglerxhorizon/web;
        # wasm-bindgen output is content-addressed by build; cache it hard.
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        types { application/wasm wasm; }
    }

    # ---- proxy: WebSocket + client asset endpoint ------------------------------
    location /ws {
        proxy_pass http://eaglerxhorizon_proxy;
        proxy_http_version 1.1;

        # these four headers are what make the upgrade work
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header Origin $http_origin;

        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # browsers pause backgrounded tabs: never let nginx kill the socket first
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;

        # binary frames must not be chunked by nginx
        proxy_request_buffering off;
    }

    # eaglercraft client bundle served by the proxy plugin itself
    location /client/ {
        proxy_pass http://eaglerxhorizon_proxy;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        add_header Cache-Control "public, max-age=3600" always;
    }

    # plain status endpoint for scripts/healthcheck.sh
    location = /healthz {
        proxy_pass http://eaglerxhorizon_proxy;
        proxy_set_header Host $host;
        access_log off;
    }
}
